<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chatbot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 700px; height: 100vh; background: #fff; display: flex; flex-direction: column; }
  h1 { font-size: 18px; margin: 0; padding: 14px 18px; border-bottom: 1px solid #e5e7eb; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #f3f4f6; }
  .error { align-self: flex-start; background: #fee2e2; color: #991b1b; }
  .bot pre { background: #1f2937; color: #fff; padding: 10px; border-radius: 8px; overflow-x: auto; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; }
  button { padding: 0 20px; font-size: 16px; border: none; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #93c5fd; }
</style>
</head>
<body>
<div id="app">
  <h1>AI Chatbot</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Type your message..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  let history = [];   // poori baat-cheet yahan save hoti hai

  function addMessage(text, cls, markdown = false) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    if (markdown) div.innerHTML = DOMPurify.sanitize(marked.parse(text));
    else div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    history.push({ role: "user", content: text });
    input.value = "";
    send.disabled = true;                          // loading state
    const loading = addMessage("Thinking...", "bot");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      loading.remove();
      if (!res.ok) throw new Error(data.detail || "Request failed");

      history.push({ role: "assistant", content: data.reply });
      addMessage(data.reply, "bot", true);         // Markdown dikhao
    } catch (err) {
      loading.remove();
      history.pop();                               // fail hone wala message history se hata do
      addMessage("Error: " + err.message, "error");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
